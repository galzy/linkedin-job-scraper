[project]
name = "linkedin_job_scraper"
version = "0.3.0"
description = "Scrapes LinkedIn job listings, filters them by keywords and stores them in a DB."
authors = [{ name = "Gal Ziv", email = "galzy@users.noreply.github.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2,<3.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "loguru>=0.7.3,<0.8.0",
    "pydantic>=2.13.4,<3.0.0",
    "sqlalchemy>=2.0.51,<2.1",
    "pyyaml>=6.0,<7.0",
    "pycountry>=26.2.16,<27.0.0",
    "geonamescache>=3.0,<4.0",
    "langdetect>=1.0.9,<2.0.0",
    "typer>=0.26,<0.27",
    "rich>=13.0,<16.0",
]

[project.scripts]
linkedin-job-scraper = "linkedin_job_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.15.21,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
